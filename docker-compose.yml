version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: faceless_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: faceless_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: faceless_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceless_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/faceless_studio
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - studio_media:/app/data
    depends_on:
      - mongodb
      - redis
      - qdrant

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceless_worker
    restart: unless-stopped
    command: celery -A app.worker.celery worker --loglevel=info -c 2
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/faceless_studio
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - studio_media:/app/data
    depends_on:
      - mongodb
      - redis
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faceless_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API=http://localhost:8000
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  studio_media:
